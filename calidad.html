<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q - CALIDAD Dashboard</title>
<link rel="stylesheet" href="calidad.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
<div class="top-bar">
  <button onclick="history.back()">Volver</button>
  <button onclick="window.open('https://docs.google.com/spreadsheets/d/113N5_KhyLXhvzQFhGua_6faSzL54DWW5ZQzcDvacry4/edit?gid=0#gid=0', '_blank')">Excel</button>
</div>
    
<div class="logo-container">
  <img src="Logo.png" alt="Logo Empresa" class="logo">
</div>

<h1>Q - CALIDAD</h1>

<div class="filters">
  <label>Día: <select id="daySelect"></select></label>
  <label>Mes: <select id="monthSelect"></select></label>
  <label>Año: <select id="yearSelect"></select></label>
  <button id="filterBtn">Filtrar</button>
  <button id="resetBtn">Restablecer</button>
</div>

<div class="main-container">
  
  <div class="column">
    <div class="dashboard-item" id="card-reclamos">
      <h3>Reclamos Hoy</h3>
      <p id="totalReclamos" class="numero-dashboard">0</p>
      <div class="indicador-mes">Mensual: <span id="mesReclamos">0</span></div>
    </div>
    <div class="chart-item">
      <h3>Evolución Mensual Reclamos</h3>
      <canvas id="reclamosChart"></canvas>
    </div>
    <div class="chart-item">
      <h3>Reclamos por Marca</h3>
      <canvas id="marcasChart"></canvas>
    </div>
  </div>

  <div class="column">
    <div class="dashboard-item" id="card-retenidas">
      <h3>Retenidas Hoy</h3>
      <p id="totalRetenidas" class="numero-dashboard">0</p>
      <div class="indicador-mes">.<span id="mesRetenidas">  </span></div>
    </div>
    <div class="chart-item">
      <h3>Evolución Unidades Retenidas</h3>
      <canvas id="unidadesRetenidasChart"></canvas>
    </div>
    <div class="chart-item">
      <h3>Evolución Retenciones Masivas</h3>
      <canvas id="retencionesMasivasChart"></canvas>
    </div>
  </div>

  <div class="column">
    <div class="dashboard-item" id="card-bd">
      <h3>BD Hoy</h3>
      <p id="totalBD" class="numero-dashboard">0%</p>
      <div class="indicador-mes">Prom. Mes: <span id="mesBD">0%</span></div>
    </div>
    <div class="chart-item">
      <h3>Evolución % Bueno Directo Diario</h3>
      <canvas id="buenoDirectoChart"></canvas>
    </div>
  </div>

</div>

<script src="calidad.js"></script>
</body>
</html>
